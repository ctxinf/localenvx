<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>localenvx — {{PROJECT}}</title>
<style>
  :root {
    color-scheme: light dark;
    --fg:#e6e6e6; --bg:#16181d; --mut:#8b93a1; --line:#2a2e37; --acc:#7aa2f7;
    --warn:#e0af68; --warn-bg:#e0af6822; --ok:#9ece6a; --ok-bg:#9ece6a1c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fg:#1c1e24; --bg:#fbfbfd; --mut:#6b7280; --line:#e2e5ea; --acc:#2f5ed8;
      --warn:#9a6700; --warn-bg:#f5d90a22; --ok:#1a7f37; --ok-bg:#1a7f371a;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,sans-serif; color:var(--fg); background:var(--bg); }
  /* Center the page: header and main share the same --wrap width */
  .wrap { max-width:960px; margin-inline:auto; padding-inline:24px; }
  header { padding-block:14px; border-bottom:1px solid var(--line); }
  header .wrap { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  .path { color:var(--mut); font-family:ui-monospace,monospace; font-size:12px; margin-right:auto; }
  main { padding-block:18px 60px; }
  select, input, textarea, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  button { cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  svg { display:block; }
  table { width:100%; border-collapse:collapse; margin-top:14px; }
  th { text-align:left; font-weight:500; color:var(--mut); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.name { font-family:ui-monospace,monospace; white-space:nowrap; }
  .value-display { display:grid; min-width:0; flex:1; }
  .value-display > span { grid-area:1 / 1; white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; }
  .value-size { visibility:hidden; font-family:ui-monospace,monospace; }
  .val { font-family:ui-monospace,monospace; cursor:pointer; color:var(--mut); word-break:break-all; }
  .val.shown { color:var(--fg); }
  .th-val { display:flex; align-items:center; gap:6px; }
  /* Comment and blank lines: no border, monospace, muted — reads like the raw .env */
  tr.cmt td { border-bottom:none; padding:2px 8px; color:var(--mut); font-family:ui-monospace,monospace;
              font-size:12.5px; white-space:pre-wrap; word-break:break-all; }
  tr.cmt.directive td { color:var(--acc); }
  tr.gap td { border-bottom:none; padding:0; height:10px; }
  .val-cell { display:flex; align-items:center; gap:8px; }
  .copy { border:none; padding:3px; color:var(--mut); border-radius:4px; flex:none; opacity:0; transition:opacity .12s; }
  tr:hover .copy, .copy:focus-visible, .copy.ok { opacity:1; }
  .copy:hover { color:var(--fg); background:var(--line); }
  .copy.ok { color:var(--ok); }
  .eye { border:none; padding:2px; color:var(--mut); border-radius:4px; }
  .eye:hover { color:var(--fg); background:var(--line); }
  .eye.on { color:var(--acc); }
  .tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 7px; border-radius:99px; border:1px solid var(--line); color:var(--mut); }
  .tag.enc { color:var(--acc); border-color:var(--acc); }
  /* The file mode must be obvious at a glance: blacklist = encrypt by default (safe),
     whitelist = plaintext by default (watch out) */
  .mode { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
          letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:99px; border:1px solid transparent; }
  .mode.blacklist { color:var(--ok);   background:var(--ok-bg);   border-color:var(--ok); }
  .mode.whitelist { color:var(--warn); background:var(--warn-bg); border-color:var(--warn); }
  .row-actions { white-space:nowrap; }
  .editor { width:100%; min-width:0; font-family:ui-monospace,monospace; }
  textarea.editor { resize:vertical; display:block; }
  .row-actions form { display:flex; gap:4px; }
  .file-comment { margin:0 0 12px; color:var(--mut); font:12.5px/1.5 ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .table-tools { display:flex; justify-content:flex-end; }
  .table-scroll { overflow-x:auto; }
  table { table-layout:fixed; min-width:720px; }
  .row-actions button { border:none; color:var(--mut); padding:4px 6px; }
  .row-actions button.primary { color:#fff; }
  #msg { margin-top:12px; color:var(--mut); min-height:1.4em; }

</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>localenvx</h1>
    <span class="path">{{PROJECT}}</span>
    <select id="file"></select>
    <span class="mode" id="mode" title=""></span>
  </div>
</header>
<main class="wrap">
  <div id="file-comment" class="file-comment" hidden></div>
  <div class="table-tools"><button id="add" type="button" title="Add variable" aria-label="Add variable">+ Add</button></div>
  <div class="table-scroll"><table>
    <colgroup><col style="width:24%"><col><col style="width:170px"><col style="width:135px"></colgroup>
    <thead><tr>
      <th>Variable</th>
      <th><span class="th-val">Value<button class="eye" id="eye" type="button" title="Reveal/hide all" aria-pressed="false"></button></span></th>
      <th>Status</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const msg = t => { $('#msg').textContent = t || ''; };
const DOTS = '••••••';

const ICON = {
  eye:     '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>',
  eyeOff:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.7A10.4 10.4 0 0 1 12 5.5c7 0 10.5 6.5 10.5 6.5a19 19 0 0 1-3.4 4.3M6.3 7.7A18.6 18.6 0 0 0 1.5 12S5 18.5 12 18.5c1.8 0 3.4-.4 4.7-1"/><path d="M10 10a3.2 3.2 0 0 0 4.3 4.3"/><path d="M3 3l18 18"/></svg>',
  copy:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M15 5.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h.5"/></svg>',
  check:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
  lock:    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>',
  unlock:  '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 7.5-2"/></svg>',
};

// Global reveal switch: off by default (guards against screenshots / screen sharing)
let revealAll = false;
function paintEye() {
  const btn = $('#eye');
  btn.innerHTML = revealAll ? ICON.eye : ICON.eyeOff;
  btn.classList.toggle('on', revealAll);
  btn.setAttribute('aria-pressed', String(revealAll));
  btn.title = revealAll ? 'Hide all values' : 'Show all values';
}
function applyReveal() {
  $$('.val').forEach(el => {
    el.classList.toggle('shown', revealAll);
    el.textContent = revealAll ? el.dataset.value : DOTS;
  });
}

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.status);
  return j;
}

async function loadFiles() {
  const j = await api('/api/files');
  const sel = $('#file');
  const keep = sel.value;
  sel.innerHTML = '';
  (j.files.length ? j.files : ['.env']).forEach(f => {
    const o = document.createElement('option'); o.value = o.textContent = f; sel.append(o);
  });
  if (keep && j.files.includes(keep)) sel.value = keep;
  await loadFile();
}

async function loadFile() {
  const path = $('#file').value || '.env';
  const j = await api('/api/file?path=' + encodeURIComponent(path));

  const mode = $('#mode');
  mode.className = 'mode ' + j.mode;
  mode.innerHTML = (j.mode === 'blacklist' ? ICON.lock : ICON.unlock) + '<span>' + j.mode + '</span>';
  mode.title = j.mode === 'blacklist'
    ? 'Encrypted by default: every unmarked variable is encrypted; use # @PLAIN to opt out'
    : 'Plaintext by default: only variables marked # @ENC are encrypted';

  const rows = $('#rows'); rows.innerHTML = '';
  // The preamble includes the file mode declaration; per-variable directives stay with rows.
  const modeIndex = j.lines.findIndex(l => l.kind === 'comment' && /@localenvx-mode:/.test(l.text));
  let preambleEnd = 0;
  const limit = modeIndex < 0 ? j.lines.length : modeIndex + 1;
  while (preambleEnd < limit) {
    const line = j.lines[preambleEnd];
    if (line.kind === 'var' || (line.kind === 'comment' && /@ENC\b|@PLAIN\b/.test(line.text))) break;
    preambleEnd++;
  }
  const preamble = j.lines.slice(0, preambleEnd).map(l => l.kind === 'comment' ? l.text : '').join('\n').trim();
  const fileComment = $('#file-comment');
  fileComment.textContent = preamble;
  fileComment.hidden = !preamble;
  j.lines.slice(preambleEnd).forEach(l => {
    rows.append(l.kind === 'var' ? row(path, l) : l.kind === 'comment' ? commentRow(l.text) : blankRow());
  });
  applyReveal();
  const n = j.lines.filter(l => l.kind === 'var').length;
  msg(n ? '' : '(this file has no variables yet)');
}

/// Render comment lines verbatim, so the page reads like the .env text itself.
function commentRow(text) {
  const tr = document.createElement('tr');
  tr.className = 'cmt';
  const td = document.createElement('td');
  td.colSpan = 4;
  td.textContent = text;
  // @ENC / @PLAIN / @localenvx-mode: are meaningful directives, not ordinary comments
  if (/@ENC\b|@PLAIN\b|@localenvx-mode:/.test(text)) tr.classList.add('directive');
  tr.append(td);
  return tr;
}

function blankRow() {
  const tr = document.createElement('tr');
  tr.className = 'gap';
  const td = document.createElement('td'); td.colSpan = 4;
  tr.append(td);
  return tr;
}

function row(path, v) {
  const tr = document.createElement('tr');

  const name = document.createElement('td'); name.className = 'name'; name.textContent = v.name;

  const val = document.createElement('td');
  const cell = document.createElement('div'); cell.className = 'val-cell';
  const span = document.createElement('span');
  span.className = 'val'; span.textContent = DOTS; span.title = 'Click to reveal/hide';
  span.dataset.value = v.value;               // A single row can still be revealed on its own
  span.onclick = () => {
    const shown = span.classList.toggle('shown');
    span.textContent = shown ? v.value : DOTS;
  };

  // Copying does not require revealing first — the value is always in the DOM;
  // revealing only guards against shoulder-surfing and screenshots
  const copy = document.createElement('button');
  copy.className = 'copy'; copy.type = 'button';
  copy.innerHTML = ICON.copy; copy.title = 'Copy value to clipboard';
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(v.value);
      copy.innerHTML = ICON.check; copy.classList.add('ok');
      msg('Copied ' + v.name + ' to the clipboard');
      setTimeout(() => { copy.innerHTML = ICON.copy; copy.classList.remove('ok'); }, 1200);
    } catch (e) {
      msg('Copy failed: ' + e.message);
    }
  };

  const display = document.createElement('div'); display.className = 'value-display';
  const size = document.createElement('span'); size.className = 'value-size';
  size.textContent = v.value || DOTS; size.setAttribute('aria-hidden', 'true');
  display.append(size, span);
  cell.append(display, copy);
  val.append(cell);

  const st = document.createElement('td');
  const tag = document.createElement('span');
  tag.className = 'tag' + (v.encrypted ? ' enc' : '');
  tag.innerHTML = v.encrypted ? ICON.lock + ' encrypted' : 'plain';
  st.append(tag);

  const act = document.createElement('td'); act.className = 'row-actions';
  const edit = document.createElement('button'); edit.textContent = 'Edit';
  edit.onclick = () => { tr.replaceWith(editorRow(path, v)); };
  const del = document.createElement('button'); del.textContent = 'Delete';
  del.onclick = async () => {
    if (!confirm('Delete ' + v.name + '?')) return;
    try { await api('/api/rm', { method: 'POST', body: JSON.stringify({ path, name: v.name }) }); await loadFile(); msg('Deleted ' + v.name); }
    catch (e) { msg('Failed: ' + e.message); }
  };
  act.append(edit, del);

  tr.append(name, val, st, act);
  return tr;
}

let editorId = 0;
function editorRow(path, v = null) {
  const tr = document.createElement('tr');
  const id = 'edit-' + ++editorId;
  const nameCell = document.createElement('td');
  const name = document.createElement('input');
  name.className = 'editor'; name.placeholder = 'NAME'; name.required = true;
  name.pattern = '[A-Za-z_][A-Za-z0-9_]*'; name.value = v ? v.name : '';
  name.readOnly = !!v; name.setAttribute('aria-label', 'Variable name');
  const valueCell = document.createElement('td');
  const value = document.createElement('textarea');
  value.className = 'editor'; value.rows = 2; value.placeholder = 'value';
  value.value = v ? v.value : ''; value.setAttribute('aria-label', 'Variable value');
  const statusCell = document.createElement('td');
  const enc = document.createElement('select'); enc.className = 'editor';
  enc.setAttribute('aria-label', 'Encryption mode');
  [['auto', 'Follow file mode'], ['enc', 'Encrypted'], ['plain', 'Plaintext']].forEach(([key, label]) => {
    const option = document.createElement('option'); option.value = key; option.textContent = label; enc.append(option);
  });
  enc.value = v ? (v.encrypted ? 'enc' : 'plain') : 'auto';
  [name, value, enc].forEach(el => el.setAttribute('form', id));
  const actions = document.createElement('td'); actions.className = 'row-actions';
  const form = document.createElement('form'); form.id = id; form.autocomplete = 'off';
  const submit = document.createElement('button'); submit.type = 'submit';
  submit.className = 'primary'; submit.textContent = 'Save';
  const cancel = document.createElement('button'); cancel.type = 'button'; cancel.textContent = 'Cancel';
  cancel.onclick = () => { if (v) tr.replaceWith(row(path, v)); else tr.remove(); };
  form.onsubmit = async e => {
    e.preventDefault();
    if (!v && [...$('#rows').querySelectorAll('td.name')].some(el => el.textContent === name.value)) {
      msg('Variable already exists: ' + name.value); name.focus(); return;
    }
    submit.disabled = cancel.disabled = true;
    try {
      await api('/api/set', { method: 'POST', body: JSON.stringify({ path, name: name.value, value: value.value, enc: enc.value }) });
      const saved = { name: name.value, value: value.value, encrypted: enc.value === 'enc' || (enc.value === 'auto' && $('#mode').classList.contains('blacklist')) };
      tr.replaceWith(row(path, saved)); applyReveal(); msg('Saved ' + saved.name);
    } catch (e) { msg('Failed: ' + e.message); }
    finally { submit.disabled = cancel.disabled = false; }
  };
  form.onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); if (!cancel.disabled) cancel.click(); } };
  // Controls belong to the row form even though they occupy separate table cells.
  [name, value, enc].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !cancel.disabled) { e.preventDefault(); cancel.click(); }
  }));
  nameCell.append(name); valueCell.append(value); statusCell.append(enc);
  form.append(submit, cancel); actions.append(form); tr.append(nameCell, valueCell, statusCell, actions);
  requestAnimationFrame(() => (v ? value : name).focus());
  return tr;
}

$('#eye').onclick = () => { revealAll = !revealAll; paintEye(); applyReveal(); };
paintEye();

$('#file').onchange = () => loadFile().catch(e => msg('Load failed: ' + e.message));
$('#add').onclick = () => {
  const editor = editorRow($('#file').value || '.env');
  $('#rows').append(editor); editor.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  msg('');
};
loadFiles().catch(e => msg('Load failed: ' + e.message));
</script>
</body>
</html>
