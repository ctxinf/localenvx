[package]
name = "localenvx"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A local encrypted .env manager."
license = "MIT"
repository = "https://github.com/ctxinf/localenvx"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "SKILL.md", "LICENSE", "tests/**"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }
tiny_http = "0.12"
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
