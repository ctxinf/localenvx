name: Test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # x64 Python also runs under emulation on Windows ARM64; the tested Rust
      # executable is still compiled natively for the runner's architecture.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Windows terminal test adapter
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: pywinpty==3.0.2
      - name: Unit tests
        run: cargo test --locked --bin localenvx
      - name: CLI end-to-end tests (including automated terminal interaction)
        run: cargo test --locked --test cli -- --nocapture
      - run: cargo package --locked --list
