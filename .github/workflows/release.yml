name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir staging
          cp README.md SKILL.md LICENSE staging/
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/localenvx.exe" staging/
            (cd staging && 7z a "../localenvx-$TARGET.zip" ./*)
          else
            cp "target/$TARGET/release/localenvx" staging/
            tar -czf "localenvx-$TARGET.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: localenvx-${{ matrix.target }}
          path: localenvx-${{ matrix.target }}.*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum localenvx-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*
